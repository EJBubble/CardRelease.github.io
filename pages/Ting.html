<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豪廷的生日卡片</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-birthday="12-18" data-name="豪廷">
  <main class="page-shell">
    <section class="gift-stage">
      <div class="person-lock" data-person-lock>
        <div class="lock-icon" aria-hidden="true">✦</div>
        <p>豪廷的生日驚喜尚未開啟</p>
        <span>將在生日當天 00:00 自動解鎖</span>
        <div class="countdown" data-person-countdown aria-label="開啟倒數"></div>
      </div>
      <div data-person-content hidden>
      <header class="intro">
        <p class="eyebrow">TING / 豪廷</p>
        <h1>生日快樂！</h1>
        <p>驚喜很快就會登場</p>
      </header>
      <div style="text-align:center;margin-top:60px">
        <img src="../assets/images/Person/Ting.jpg" alt="豪廷的大頭貼" style="width:min(300px,70vw);aspect-ratio:1;object-fit:cover;border:10px solid #fff;border-radius:28px;box-shadow:0 18px 40px rgba(122,79,99,.16)">
        <p><a class="close-card" href="../index.html" style="display:inline-block;margin-top:24px;text-decoration:none">回到首頁</a></p>
      </div>
      </div>
    </section>
  </main>
  <script src="../assets/js/person-lock.js"></script>
</body>
</html>
